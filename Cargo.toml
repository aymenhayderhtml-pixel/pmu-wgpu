[package]
name = "pmu-wgpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
wgpu = "=25.0.2"
winit = "=0.30.11"
glam = "=0.30.4"
bytemuck = { version = "=1.22.0", features = ["derive"] }
pollster = "=0.4.0"
env_logger = "=0.11.8"
gltf = { version = "=1.4.1", features = ["KHR_texture_transform"] }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
